<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-label="PS4 Tools">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#b07bff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fd"/>
      <stop offset="1" stop-color="#c6d2e8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff9f45"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="96" height="96" rx="22"/>
    </clipPath>
    <clipPath id="hull">
      <path d="M48 9 C56 18 62 28 62 40 L62 64 Q62 67 59 67 L37 67 Q34 67 34 64 L34 40 C34 28 40 18 48 9 Z"/>
    </clipPath>
  </defs>

  <rect width="96" height="96" rx="22" fill="#141a25" stroke="#2b3546" stroke-width="2"/>

  <g clip-path="url(#round)">
    <rect width="96" height="96" fill="url(#glow)"/>

    <!-- fins -->
    <path d="M35 43 C26 49 22 59 24 70 L35 63 Z" fill="url(#accent)"/>
    <path d="M61 43 C70 49 74 59 72 70 L61 63 Z" fill="url(#accent)"/>

    <!-- exhaust -->
    <path d="M42 61 C42 73 45 80 48 88 C51 80 54 73 54 61 Z" fill="url(#flame)"/>
    <path d="M45 62 C45 70 46.5 75 48 79 C49.5 75 51 70 51 62 Z" fill="#ffe9a8" opacity="0.9"/>

    <!-- hull -->
    <path d="M48 9 C56 18 62 28 62 40 L62 64 Q62 67 59 67 L37 67 Q34 67 34 64 L34 40 C34 28 40 18 48 9 Z" fill="url(#body)"/>
    <rect x="30" y="4" width="36" height="32" fill="url(#accent)" clip-path="url(#hull)"/>
    <path d="M48 9 C56 18 62 28 62 40 L62 64 Q62 67 59 67 L37 67 Q34 67 34 64 L34 40 C34 28 40 18 48 9 Z" fill="none" stroke="#94a6c4" stroke-width="1.2" opacity="0.5"/>

    <!-- name on the hull -->
    <text x="48" y="56" text-anchor="middle" font-family="DejaVu Sans, Cantarell, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.3" fill="#1b2436">PS4</text>

    <!-- sparkles -->
    <path d="M20 25 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#8fa9ff"/>
    <path d="M76 33 l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1 Z" fill="#b07bff" opacity="0.85"/>
    <circle cx="74" cy="22" r="1.4" fill="#7c9cff" opacity="0.8"/>
    <circle cx="22" cy="45" r="1.1" fill="#b07bff" opacity="0.7"/>
  </g>

  <text x="118" y="64" font-family="DejaVu Sans, Cantarell, sans-serif" font-size="46" font-weight="bold" letter-spacing="-0.5" fill="url(#accent)">Tools</text>
</svg>
